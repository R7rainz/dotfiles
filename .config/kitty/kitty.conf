# ─────────────────────────────────────────────
# Kitty Config - Minimal Black + Red Theme
# ─────────────────────────────────────────────

# ────────────────
# FONT
# ────────────────
font_family      JetBrains Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# ────────────────
# SPACING & LAYOUT
# ────────────────
window_padding_width  6
window_margin_width   0
initial_window_width  400
initial_window_height 800

# ────────────────
# PERFORMANCE
# ────────────────
repaint_delay        5
input_delay          0
sync_to_monitor      yes
enable_audio_bell    no

# ────────────────
# CURSOR
# ────────────────
cursor                    #ff4d4d
cursor_text_color         #000000
cursor_shape              block
cursor_blink_interval     0.45
cursor_stop_blinking_after 0

cursor_trail              12
cursor_trail_decay        0.015 0.20

# ────────────────
# MINIMAL BLACK + RED THEME
# ────────────────
foreground              #f5f5f5
background              #000000
background_opacity      1.0

selection_foreground    #000000
selection_background    #ff4d4d

url_color               #ff6b6b

# Normal colors
color0   #000000
color1   #ff4d4d
color2   #8fd694
color3   #ffd166
color4   #8ab4f8
color5   #c792ea
color6   #89ddff
color7   #d0d0d0

# Bright colors
color8   #4a4a4a
color9   #ff6b6b
color10  #b9f6ca
color11  #ffe082
color12  #a8c7fa
color13  #d2a8ff
color14  #a6e3ff
color15  #ffffff

# ────────────────
# TAB BAR
# ────────────────
tab_bar_style           powerline
active_tab_background   #ff4d4d
active_tab_foreground   #000000
inactive_tab_background #0a0a0a
inactive_tab_foreground #8a8a8a
tab_separator           "  "

# ────────────────
# WINDOW BORDERS
# ────────────────
active_border_color     #ff4d4d
inactive_border_color   #1a1a1a
bell_border_color       #ff0000

# ────────────────
# SCROLL & INPUT FEEL
# ────────────────
scrollback_lines        5000
mouse_hide_wait         1.5
wheel_scroll_multiplier 2.5

# ────────────────
# HYPERLINKS
# ────────────────
allow_hyperlinks yes

# ────────────────
# NERD FONT SYMBOLS
# ────────────────
symbol_map U+E0B0-U+E0B3 Hurmit Nerd Font

# ────────────────
# SHELL
# ────────────────
shell /bin/fish

# ────────────────
# LIGATURES
# ────────────────
enable_ligatures yes
disable_ligatures never

# ────────────────
# FONT SIZE SHORTCUTS
# ────────────────

# Increase font size
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+plus  change_font_size all +1.0
map ctrl+equal       change_font_size all +1.0
map ctrl+plus        change_font_size all +1.0
map ctrl+kp_add      change_font_size all +1.0

# Decrease font size
map ctrl+minus       change_font_size all -1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+kp_subtract change_font_size all -1.0

# Reset font size
map ctrl+0                change_font_size all 0
map ctrl+shift+backspace  change_font_size all 0

# ────────────────
# COPY / PASTE
# ────────────────
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# ────────────────
# TAB MANAGEMENT
# ────────────────
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# ────────────────
# WINDOW MANAGEMENT
# ────────────────
map ctrl+shift+enter new_window
map ctrl+shift+q close_window

# ────────────────
# OPTIONAL CLEAN LOOK
# ────────────────
# hide_window_decorations yes
