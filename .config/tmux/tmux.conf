# ==========================================================
#                    O M A R C H Y   T M U X
#                  Clean • Calm • Theme-aware
# ==========================================================

# ----------------------------
# Prefix
# ----------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind r
bind r source-file ~/.tmux.conf \; display-message "󰆍 tmux reloaded"

# ----------------------------
# Terminal
# ----------------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ----------------------------
# General
# ----------------------------
set -g mouse on
set-window-option -g mode-keys vi

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ----------------------------
# Pane Navigation
# ----------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ----------------------------
# Better Splits
# ----------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind x kill-pane

# ----------------------------
# Appearance
# ----------------------------
set -g status-position bottom
set -g status on
set -g status-interval 5

# Use the terminal's ANSI palette so Omarchy theme changes flow into tmux.
# colour0 = background, colour6 = accent, colour7 = foreground, colour8 = muted.
set -g status-style "bg=colour0,fg=colour7"
set -g status-justify centre
set -g status-left-length 40
set -g status-right-length 100

# Pane borders
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour6"
set -g pane-border-lines single

set -g display-panes-active-colour colour6
set -g display-panes-colour colour8
set -g mode-style "fg=colour0,bg=colour3,bold"
set -g message-style "fg=colour0,bg=colour6,bold"
set -g message-command-style "fg=colour0,bg=colour6,bold"

# Keep the terminal title useful when tmux is running.
set -g set-titles on
set -g set-titles-string "#S • #W"

# ----------------------------
# Status Bar Layout
# ----------------------------

# Left block: an accent tab for the current session.
set -g status-left "#[fg=colour0,bg=colour6,bold] 󰆍 #S #[fg=colour6,bg=colour0]#[fg=colour0,bg=colour0]"

# Keep the window row quiet and let the active window carry the accent.
setw -g window-status-separator ""
setw -g window-status-style "fg=colour8,bg=colour0"
setw -g window-status-format "#[fg=colour8,bg=colour0]  #I #[fg=colour8]│ #[fg=colour7]#W "
setw -g window-status-current-style "fg=colour0,bg=colour6,bold"
setw -g window-status-current-format "#[fg=colour0,bg=colour6,bold]  #I  #W #[nobold,fg=colour6,bg=colour0]"
setw -g window-status-activity-style "fg=colour3,bg=colour0,bold"
setw -g window-status-bell-style "fg=colour0,bg=colour1,bold"

# Right block: lightweight, local status information only.
set -g status-right "#[fg=colour8,bg=colour0]│ #[fg=colour7,bg=colour0]󰥔 %a %d %b #[fg=colour6,bold]%H:%M #[fg=colour8,bg=colour0] "

# ----------------------------
# Auto Rename Windows
# ----------------------------
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_command}'

# Better names for common apps
setw -g monitor-activity off

# ----------------------------
# Plugins
# ----------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Session persistence
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ----------------------------
# TPM
# ----------------------------
run '~/.tmux/plugins/tpm/tpm'

