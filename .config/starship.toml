"$schema" = "https://starship.rs/config-schema.json"

scan_timeout = 50
command_timeout = 1000
follow_symlinks = false
add_newline = false

format = """
$directory\
${custom.giturl}\
$git_branch\
${custom.git_worktree}\
$git_status\
$line_break\
$character\
"""

right_format = """
$nodejs\
$golang\
$python\
$rust\
$java\
$docker_context\
$cmd_duration
"""

[directory]
style = "bold blue"
format = "[$path]($style)"
truncation_length = 3
truncate_to_repo = true

[line_break]
disabled = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[cmd_duration]
min_time = 2000
format = "[$duration](yellow)"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style)"
style = "bold purple"

[git_status]
format = "[$untracked$staged$modified$renamed$deleted$stashed$conflicted$ahead_behind]($style)"
staged = "[+](green)"
modified = "[!](yellow)"
renamed = "[»](blue)"
deleted = "[-](red)"
untracked = "[?](red)"
stashed = "[≡](purple)"
conflicted = "[✖](red bold)"
ahead = "[⇡${count}](cyan)"
behind = "[⇣${count}](yellow)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](purple)"

[custom.giturl]
description = "Git remote provider"
command = """
remote=$(git config --get remote.origin.url 2>/dev/null)

if [[ "$remote" =~ github ]]; then
    echo ""
elif [[ "$remote" =~ gitlab ]]; then
    echo "󰮠"
elif [[ "$remote" =~ bitbucket ]]; then
    echo "󰞁"
fi
"""
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
format = "[$output ](cyan)"
require_repo = true

[custom.git_worktree]
command = """
common_dir=$(git rev-parse --git-common-dir 2>/dev/null)
git_dir=$(git rev-parse --git-dir 2>/dev/null)

if [ "$common_dir" != "$git_dir" ]; then
    echo "⛓"
fi
"""
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
format = "[$output ](green)"
require_repo = true

[nodejs]
symbol = "󰎙 "

[golang]
symbol = " "

[python]
symbol = " "

[rust]
symbol = "󱘗 "

[java]
symbol = " "

[docker_context]
symbol = " "
